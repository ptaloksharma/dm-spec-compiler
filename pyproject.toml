[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dm-spec-compiler"
version = "0.4.0"
description = "Standalone universal spec-to-code & architecture compiler for dm-agent-kit agent workspaces. Deterministic parsers, Architect-in-the-Loop, zero LLM codegen."
authors = [{ name = "DM Digital Solutions B.V." }]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dm-spec-compiler = "dm_spec_compiler.cli:main"

[tool.setuptools.packages.find]
include = ["dm_spec_compiler*"]
